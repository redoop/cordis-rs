[workspace]
resolver = "2"
members = ["crates/cordis", "crates/cordis-plugin-timer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cordis = { path = "crates/cordis" }

[profile.dev]
opt-level = 0
