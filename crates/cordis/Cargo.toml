[package]
name = "redoop-cordis"
description = "A Rust port of the cordis plugin kernel: context/fiber/registry/service/event, where everything is a plugin."
# crates.io already has `cordis` (placeholder) and `cordis-rs`; published under
# the org name while keeping the library target name `cordis` so consumers keep
# writing `use cordis::...` unchanged.
[lib]
name = "cordis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/redoop/cordis-rs"
keywords = ["plugin", "kernel", "dependency-injection", "event-bus", "framework"]
categories = ["development-tools", "asynchronous"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
